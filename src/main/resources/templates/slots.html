<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Available Slots</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/">Hospital Scheduler</a>
        <nav class="nav">
            <a href="/slots">Slots</a>
            <a href="/book">Book</a>
            <a href="/appointments">Appointments</a>
            <a href="/provider/availability">Provider</a>
            <a href="/health">Health</a>
        </nav>
    </div>
</header>

<main class="page">
    <h1 class="page-title">Available Appointment Slots</h1>
    <p class="lead">Review open and booked provider slots. Providers can add new availability from this page.</p>

    <section class="card section">
        <h2>Provider Add Slot</h2>
        <form action="/provider/availability" method="post" class="form-grid">
            <label>Doctor ID
                <input type="number" name="doctorId" value="2" required>
            </label>
            <label>Date
                <input type="date" name="date" required>
            </label>
            <label>Start
                <input type="time" name="startTime" required>
            </label>
            <label>End
                <input type="time" name="endTime" required>
            </label>
            <label>Service ID
                <input type="number" name="serviceId" value="1" required>
            </label>
            <label>&nbsp;
                <button type="submit">Create Slot</button>
            </label>
        </form>
    </section>

    <section class="table-wrap section">
        <table>
            <thead>
            <tr>
                <th>Slot</th>
                <th>Doctor</th>
                <th>Date</th>
                <th>Start</th>
                <th>End</th>
                <th>Service</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="slot : ${slots}">
                <td th:text="${slot.slotId}"></td>
                <td th:text="${slot.doctorId}"></td>
                <td th:text="${slot.date}"></td>
                <td th:text="${slot.startTime}"></td>
                <td th:text="${slot.endTime}"></td>
                <td th:text="${slot.serviceId}"></td>
                <td>
                    <span class="status"
                          th:classappend="${slot.status == 'Available'} ? ' available' : ' canceled'"
                          th:text="${slot.status}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
